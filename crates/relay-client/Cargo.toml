[package]
name = "relay-client"
version = "0.1.0"
edition = "2021"
description = "桌面端连中继：TLS + hello + session-core 帧。环回可跳过自签，上线默认严格校验。"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
session-core = { path = "../session-core" }
webpki-roots = "0.26"
