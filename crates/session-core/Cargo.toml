[package]
name = "session-core"
version = "0.1.0"
edition = "2021"
description = "远控会话协议：帧、输入、直连密钥、ticket 形态校验。不画界面，不碰账本。"

[lib]
name = "session_core"
path = "src/lib.rs"

[dependencies]
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
zeroize = { version = "1", features = ["derive"] }
