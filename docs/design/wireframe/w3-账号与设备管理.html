    <h1>W3 · 账号与设备管理</h1>
    <p class="lede">
      账号部分最容易"看起来没问题但埋雷"：<b>找回密码 ≠ 恢复码</b>、<b
        >取消授权 ≠ 移除设备</b
      >、
      <b>注销入口要 3 步内可达并给 30 天反悔期</b
      >。这三件事写错任何一件，都会在真实客诉里放大成合规问题。 <br />本页 6
      帧，其中 4 帧是合规 / 已拍板决策的执行体。
    </p>

    <div class="flow">

      <figure class="frame" id="w3-01">

          <span class="fid">W3-01</span

          v2 §1 认证 · §6.2
        </figcaption>
        <div class="screen screen--desk" style="height: 444px">
          <div class="chrome">
            <span class="dot"></span><span class="dot"></span

                    <span class="muted"

                  >

              </div>
              <div

              </div>

            <div class="box" style="width: 330px; padding: 16px">

              </div>
              <span class="label">手机号</span>
              <div class="input" style="margin-bottom: 10px">请输入手机号</div>

                <span class="input grow">6 位数字</span
                ><span class="btn">获取验证码</span>
              </div>
              <span class="label">设置密码</span>
              <div class="input" style="margin-bottom: 10px">至少 8 位</div>
              <div class="hstack" style="margin-bottom: 10px">
                <span style="width: 14px">☐</span
                ><span class="tiny"
                  >我已阅读并同意《用户协议》《隐私政策》</span
                >
              </div>
              <span class="btn solid block">注册</span>

              <div class="box--fill box" style="padding: 9px; margin-top: 12px">
                <span class="tiny"
                  ><b>关于实名：注册不需要实名。</b><br />
                  只有在使用中继、跨账号连接、或触发风控时，才会提示你完成实名。</span
                >
              </div>
            </div>

        <ul class="notes">
          <li>
            <b>①</b> 生物识别是<b>快捷登录</b>而不是"唯一的登录方式"：必须有密码
            / 验证码的常规路径兜底（换机、重装后不能把人锁在门外）。
          </li>
          <li>
            <b>②</b> 🔴 <b>注册页必须明说"注册不需要实名"</b>（D17
            延迟实名）。否则用户看到"实名"两个字就会流失 ——
            这是把已拍板的政策真正执行到界面上的地方。
          </li>
          <li>
            注册页不放"立即购买/试用"任何商业化元素：P0
            阶段新用户的第一次接触只谈可用性。
          </li>
        </ul>
      </figure>

      <!-- ============ W3-02 ============ -->
      <figure class="frame" id="w3-02">
        <figcaption>
          <span class="fid">W3-02</span
          ><b>找回密码 + 恢复码（🔴 两种语义必须分开）</b> · 层① 红线执行体 ·
          P0　|　来源 账号设计 §2 · v2 §6.2
        </figcaption>
        <div class="screen screen--desk" style="height: 420px">
          <div class="chrome">
            <span class="dot"></span><span class="dot"></span
            ><span class="dot"></span>
            <span style="margin-left: 6px">账号恢复</span>
          </div>
          <div
            class="pad"
            style="height: calc(100% - 28px); display: flex; gap: 24px"
          >
            <div class="box" style="width: 330px; padding: 16px">
              <b>① 重置密码</b>
              <div class="tiny muted" style="margin: 6px 0 12px">
                手机号还能用的时候走这条路。改完后账号还在，设备绑定还在。
              </div>
              <span class="label">手机号</span>
              <div class="input" style="margin-bottom: 10px">138****6721</div>
              <span class="label">短信验证码</span>
              <div class="hstack" style="margin-bottom: 10px">
                <span class="input grow">6 位数字</span
                ><span class="btn">获取</span>
              </div>
              <span class="label">新密码</span>
              <div class="input" style="margin-bottom: 12px">至少 8 位</div>
              <span class="btn solid block">重置密码</span>
            </div>

            <div class="box" style="width: 330px; padding: 16px">
              <b>② 用恢复码登录（换号 / 收不到短信）</b>
              <div class="tiny muted" style="margin: 6px 0 12px">
                手机号已经不用了走这条路。<b
                  >这是自助找回账号的兜底，不是"第二个密码"。</b
                >
              </div>
              <span class="label">账号</span>
              <div class="input" style="margin-bottom: 10px">138****6721</div>
              <span class="label">恢复码</span>
              <div
                class="input"
                style="margin-bottom: 6px; font-family: Consolas, monospace"
              >
                XXXX-XXXX-XXXX-XXXX
              </div>
              <div class="tiny muted" style="margin-bottom: 12px">
                区分大小写，请原样输入
              </div>
              <span class="btn solid block">验证恢复码</span>
              <div
                style="height: 1px; background: var(--line2); margin: 14px 0"
              ></div>
              <div class="hstack">
                <span class="tiny"><b>查看 / 重新生成我的恢复码</b></span>
                <span class="grow"></span><span class="btn sm">打开</span>
              </div>
              <div class="tiny muted" style="margin-top: 8px">
                打开后<b>只显示一次</b>，需当场抄下或保存；重新生成会使旧恢复码立即失效。
              </div>
            </div>
          </div>
          <span class="pin" style="left: 24px; top: 56px">1</span>
          <span class="pin" style="left: 376px; top: 56px">2</span>
          <span class="pin" style="left: 376px; top: 328px">3</span>
        </div>
        <ul class="notes">
          <li>
            <b>①</b> 🔴
            <b>两种语义必须分开呈现</b
            >：「重置密码」与「用恢复码登录」不是同一件事，也不是同一种失败场景。合成一个"找回账号"入口，会让换号用户永远找不到路。
          </li>
          <li>
            <b>②</b>
            恢复码页面必须<b>说清它是什么</b>（换号时的兜底），否则用户不会保存它，等真的需要时就来不及了。
          </li>
          <li>
            <b>③</b> 恢复码<b>只显示一次</b>，且必须当场让用户确认已保存（复制 /
            下载 / 打印三选一），不可"下次再看"。
          </li>
        </ul>
      </figure>

      <!-- ============ W3-03 ============ -->
      <figure class="frame" id="w3-03">
        <figcaption>
          <span class="fid">W3-03</span><b>双重验证（2FA）</b> · 层① 安全硬项 ·
          P0　|　来源 v2 §1 认证（生物识别 + 双重验证）
        </figcaption>
        <div class="screen screen--panel">
          <div class="chrome">
            <span class="dot"></span><span class="dot"></span

          </div>
          <div class="pad stack" style="height: calc(100% - 28px)">
            <div class="item" style="border: 0">
              <span
                ><b>双重验证</b><br /><span class="tiny muted"
                  >新设备登录时需额外输入一次动态码</span
                ></span
              >
              <span class="grow"></span><span class="tag on">已开启</span>
            </div>

            <div>
              <span class="label">验证方式</span>
              <div class="stack tiny" style="border: 1px solid var(--line)">
                <div class="item sel">
                  <span style="width: 14px">◉</span
                  ><span>身份验证器 App（推荐）</span>
                </div>
                <div class="item">
                  <span style="width: 14px">○</span><span>短信验证码</span>
                </div>
              </div>
            </div>

            <div>
              <span class="label">输入 6 位动态码</span>
              <div class="hstack">
                <span class="input grow">＿ ＿ ＿ ＿ ＿ ＿</span
                ><span class="btn">验证</span>
              </div>
            </div>

            <div class="box box--fill" style="padding: 10px">
              <b>备份码</b>
              <div class="tiny muted" style="margin: 5px 0 8px">
                手机丢失时用它登录。共 10 个，每个只能用一次。
              </div>
              <div class="hstack">
                <span class="btn sm">下载备份码</span
                ><span class="btn sm">重新生成</span>
              </div>
            </div>

            <div class="grow"></div>
            <div class="hstack">
              <span class="btn">关闭双重验证</span><span class="grow"></span
              ><span class="btn solid">保存</span>
            </div>
          </div>
          <span class="pin" style="left: 390px; top: 100px">1</span>
          <span class="pin" style="left: 390px; top: 284px">2</span>
        </div>
        <ul class="notes">
          <li>
            <b>①</b> 「身份验证器 App」优先于短信 —— 短信可被 SIM
            卡劫持，而我们做的是<b>远程控制</b>，账号被夺等于电脑被夺。
          </li>
          <li>
            <b>②</b> 备份码必须存在且醒目：2FA
            最常见的客诉是"手机丢了，我自己也进不去"。
          </li>
          <li>关闭 2FA 需二次验证（本稿未画，开发时按同页内联确认处理）。</li>
        </ul>
      </figure>

          <div class="bar bar--bottom">
            <span class="tiny muted"
              >「从未连接」=

          </li>
          <li>
            <b>②</b> 「一键解绑全部」放在列表底部、单独一行，走 W3-06

          <li>
            <b>①</b>
            两个动作<b>不得放进同一个"解除绑定"菜单项</b>：它们后果不同（可恢复
            vs 需重新绑定），用户分不清就会误操作。
          </li>
          <li>
            <b>②</b> 两个按钮<b>并列、同一屏</b>，不隐藏任一条路径 ——
            把"移除"藏起来只会让用户改用"取消授权"（未达目的，还会再来一次）。
          </li>
          <li>
            <b>③</b> 确认文案必须<b>写出"之后会怎样"</b>，而不是"确定要移除吗"。
          </li>
          <li>
            本屏同时是<a href="w2-被控端.html#w2-01">W2-01</a
            >「允许被连接」开关的账号侧对应物，两处语义必须一致。
          </li>
        </ul>
