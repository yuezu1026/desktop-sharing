services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desktop
      POSTGRES_PASSWORD: desktop
      POSTGRES_DB: desktop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desktop -d desktop"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - desktop-pg:/var/lib/postgresql/data
  control-plane:
    build:
      context: ../services/control-plane
    environment:
      DATABASE_URL: postgres://desktop:desktop@postgres:5432/desktop
      DEVICE_QUOTA: "150"
      FREE_RELAY_BYTES: "2000000000"
      FREE_BITRATE_KBPS: "4000"
      FREE_MAX_FPS: "30"
      DISPLAY_MINUTE_FLOOR_KBPS: "2000"
      TICKET_TTL_SECONDS: "90"
      SMS_DEV_EXPOSE: "1"
      # 仅本地编排。上线必须换成独立密钥，不能沿用这两行。
      RELAY_SHARED_SECRET: local-relay
      SIGNAL_SHARED_SECRET: local-signal
      PRICE_VERSION: P8
      YEARLY_PRICE_CENTS: "15800"
      MONTHLY_PRICE_CENTS: "2400"
      YEARLY_PER_MONTH_LABEL: "13.2"
      ORDER_CALLBACK_SECRET: local-order
      REAL_NAME_CALLBACK_SECRET: local-realname
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  signal:
    build:
      context: ../services/signal
    environment:
      CONTROL_PLANE_URL: http://control-plane:8080
      SIGNAL_SHARED_SECRET: local-signal
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      - control-plane
  relay:
    build:
      context: ../services/relay
    environment:
      CONTROL_PLANE_URL: http://control-plane:8080
      RELAY_SHARED_SECRET: local-relay
      RELAY_PORT: "443"
      HEARTBEAT_SECONDS: "30"
    ports:
      - "443:443"
    depends_on:
      - control-plane
volumes:
  desktop-pg:
