[package]
name = "desktop-controller"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "desktop-controller"
path = "src/main.rs"

[dependencies]
serde_json = "1"
session-core = { path = "../../crates/session-core" }
relay-client = { path = "../../crates/relay-client" }
signal-client = { path = "../../crates/signal-client" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
