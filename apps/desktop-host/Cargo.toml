[package]
name = "desktop-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "desktop-host"
path = "src/main.rs"

[dependencies]
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
session-core = { path = "../../crates/session-core" }
relay-client = { path = "../../crates/relay-client" }
signal-client = { path = "../../crates/signal-client" }
direct-client = { path = "../../crates/direct-client" }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
