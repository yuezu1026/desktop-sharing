<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>运营台</title>
  <style>
    body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; margin: 24px; color: #1a1a1a; }
    label, button, input { min-height: 36px; }
    button { margin-right: 8px; }
    section { margin-top: 16px; }
    .muted { color: #5c6570; font-size: 13px; line-height: 1.5; }
    code { user-select: all; background: #f4f5f7; padding: 4px 8px; }
    #setupBox[hidden], #desk[hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>运营台</h1>
  <p>内部账号是邮箱和动态码。不能自助注册，也不能用第三方账号进入。</p>
  <form id="loginForm">
    <label>邮箱 <input id="email" autocomplete="username"></label>
    <label>密码 <input id="password" type="password" autocomplete="current-password"></label>
    <label>动态码 <input id="totpCode" inputmode="numeric" autocomplete="one-time-code"></label>
    <p><button type="submit">进入运营台</button></p>
    <p id="loginError" class="muted"></p>
  </form>
  <section id="setupBox" hidden>
    <p id="setupHint" class="muted"></p>
    <p>密钥（只出现这一次）：<code id="totpSecret"></code></p>
    <label>验证器当前动态码 <input id="setupTotpCode" inputmode="numeric" autocomplete="one-time-code"></label>
    <p><button type="button" id="confirmTotp">确认绑定</button></p>
    <p id="setupError" class="muted"></p>
  </section>
  <section id="desk" hidden>
    <label>用户手机号 <input id="phone"></label>
    <p><button type="button" id="lookup">查用户</button></p>
    <pre id="result"></pre>
    <p>
      <button type="button" id="meter">查计量</button>
      <button type="button" id="orders">查订单</button>
    </p>
    <label>补偿原因 <input id="reason"></label>
    <label>补偿字节 <input id="bytes" inputmode="numeric"></label>
    <p><button type="button" id="compensate">调时长补偿</button></p>
    <label>复核单号 <input id="approvalId"></label>
    <p><button type="button" id="approveCompensation">批准补偿复核</button></p>
    <p>
      <button type="button" id="ban">封禁</button>
      <button type="button" id="unban">解封</button>
    </p>
    <h2>例外加白</h2>
    <p class="muted">用户侧自助加白是主路径；这里只做兜底。若本台最常点这个按钮，说明产品没做完。</p>
    <label>被控设备 ID <input id="hostDeviceId"></label>
    <label>控制端账号 ID <input id="controllerAccountId"></label>
    <p>
      <label>
        <input id="fraudAck" type="checkbox">
        已再次确认反诈说明
      </label>
    </p>
    <p><button type="button" id="whitelist">例外加白</button></p>
    <p><button type="button" id="refund">退款跳到渠道后台</button></p>
  </section>
  <script type="module">
    import {
      approveCompensationRequest,
      compensationOutcome,
      confirmTotpOutcome,
      formatMeterForOps,
      loginOutcome,
      whitelistRequest,
    } from "/ops/ops-ui.mjs";

    // 退款不在这页收款。计量只读账本，不另造一份汇总。
    const loginError = document.getElementById("loginError");
    const setupBox = document.getElementById("setupBox");
    const setupHint = document.getElementById("setupHint");
    const setupError = document.getElementById("setupError");
    const totpSecret = document.getElementById("totpSecret");
    const result = document.getElementById("result");
    let staffToken = "";
    let setupToken = "";
    let accountId = "";
    let orderId = "";

    async function callApi(path, options) {
      const headers = { "content-type": "application/json" };
      if (staffToken) headers.authorization = "Bearer " + staffToken;
      const response = await fetch(path, { ...options, headers });
      const body = await response.json();
      result.textContent = JSON.stringify(body, null, 2);
      return { ok: response.ok, body };
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      loginError.textContent = "";
      setupError.textContent = "";
      const response = await callApi("/v1/ops/sessions", {
        method: "POST",
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
          totpCode: document.getElementById("totpCode").value,
        }),
      });
      const outcome = loginOutcome(response.body, response.ok);
      if (outcome.kind === "setup") {
        setupToken = outcome.setupToken;
        totpSecret.textContent = outcome.totpSecret;
        setupHint.textContent = outcome.hint;
        setupBox.hidden = false;
        document.getElementById("desk").hidden = true;
        return;
      }
      if (outcome.kind !== "ready") {
        loginError.textContent = outcome.hint;
        return;
      }
      staffToken = outcome.token;
      setupBox.hidden = true;
      document.getElementById("password").value = "";
      document.getElementById("desk").hidden = false;
    });

    document.getElementById("confirmTotp").addEventListener("click", async () => {
      setupError.textContent = "";
      const response = await callApi("/v1/ops/totp", {
        method: "POST",
        body: JSON.stringify({
          setupToken,
          totpCode: document.getElementById("setupTotpCode").value,
        }),
      });
      const outcome = confirmTotpOutcome(response.body, response.ok);
      setupError.textContent = outcome.hint;
      if (outcome.kind === "confirmed") {
        setupToken = "";
        totpSecret.textContent = "";
        document.getElementById("setupTotpCode").value = "";
        setupBox.hidden = true;
      }
    });

    document.getElementById("lookup").addEventListener("click", async () => {
      const phone = document.getElementById("phone").value;
      const response = await callApi("/v1/ops/users?phone=" + encodeURIComponent(phone));
      accountId = response.body.accountId || "";
    });
    document.getElementById("meter").addEventListener("click", async () => {
      if (!accountId) return;
      const response = await callApi("/v1/ops/users/" + accountId + "/meter");
      result.textContent = JSON.stringify(formatMeterForOps(response.body), null, 2);
    });
    document.getElementById("orders").addEventListener("click", async () => {
      if (!accountId) return;
      const response = await callApi("/v1/ops/users/" + accountId + "/orders");
      const first = response.body.orders && response.body.orders[0];
      orderId = first ? first.orderId : "";
    });
    document.getElementById("compensate").addEventListener("click", async () => {
      if (!accountId) return;
      const response = await callApi("/v1/ops/compensations", {
        method: "POST",
        body: JSON.stringify({
          accountId,
          bytes: Number(document.getElementById("bytes").value),
          reason: document.getElementById("reason").value,
        }),
      });
      const outcome = compensationOutcome(response.body, response.ok);
      if (outcome.approvalId) {
        document.getElementById("approvalId").value = outcome.approvalId;
      }
      result.textContent = outcome.hint + "\n" + JSON.stringify(response.body, null, 2);
    });
    document.getElementById("approveCompensation").addEventListener("click", async () => {
      const prepared = approveCompensationRequest({
        approvalId: document.getElementById("approvalId").value,
      });
      if (!prepared.ok) {
        result.textContent = prepared.message;
        return;
      }
      await callApi("/v1/ops/compensations/" + prepared.approvalId + "/approve", {
        method: "POST",
        body: JSON.stringify({}),
      });
    });
    document.getElementById("ban").addEventListener("click", () => {
      if (!accountId) return;
      callApi("/v1/ops/users/" + accountId + "/ban", {
        method: "POST",
        body: JSON.stringify({ banned: true, reason: document.getElementById("reason").value }),
      });
    });
    document.getElementById("unban").addEventListener("click", () => {
      if (!accountId) return;
      callApi("/v1/ops/users/" + accountId + "/ban", {
        method: "POST",
        body: JSON.stringify({ banned: false, reason: document.getElementById("reason").value }),
      });
    });
    document.getElementById("whitelist").addEventListener("click", async () => {
      const prepared = whitelistRequest({
        hostDeviceId: document.getElementById("hostDeviceId").value,
        controllerAccountId: document.getElementById("controllerAccountId").value,
        reason: document.getElementById("reason").value,
        fraudAcknowledged: document.getElementById("fraudAck").checked,
      });
      if (!prepared.ok) {
        result.textContent = prepared.message;
        return;
      }
      await callApi("/v1/ops/trusted-pairs", {
        method: "POST",
        body: JSON.stringify(prepared.body),
      });
    });
    document.getElementById("refund").addEventListener("click", async () => {
      if (!orderId) return;
      const response = await callApi("/v1/ops/orders/" + orderId + "/refund-jump");
      if (response.body.url) window.open(response.body.url, "_blank", "noopener");
    });
  </script>
</body>
</html>
